[words]
# Case-insensitive whole words. A book's lexicon adds its own, such as the words of its example IDs.

[check]
# `re-check narration` lists every word in the spoken text that still holds a digit or one of these characters,
# or is written in capitals or camelCase, unless a lexicon reads it or it's allowed here.
characters = "_/@#<>{}|`\\^~*+=$€£%"
allow = ["I", "A", "OK", "TV"]
