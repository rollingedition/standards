[spaced]
# Read as a word only with a space on each side, as in "p < 0.05". Attached, as in "<sep>", it's code, which a
# book's lexicon says how to read.
"<" = "less than"
">" = "greater than"
"+" = "plus"
"/" = "over"
"|" = "given"

[code]
# Inline code that no lexicon entry covers is read by its words: lib.store.product_text is "lib dot store dot
# product text", and governance/users.toml "governance slash users dot toml".
dot = "dot"
slash = "slash"

