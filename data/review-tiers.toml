# Review tiers and serious-risk flags. Triage sorts each green pull request into exactly
# one tier, and flags it when a rule below matches. Until the triage agent calls Claude, the platform's rule-based
# triage applies the file classes and rules below.
#
# Open verification: in every tier, the agent approves a pull request once its checks pass, and it merges
# itself. Only a flagged pull request waits, for a Rolling Edition maintainer.

# Which files a change touches decides what kind of change it can be. A file in none of these classes is
# "unknown": triage treats it as the book's settings, and [flags.unknown-files] flags it.
[files]
deps = ["examples/requirements.txt", "examples/requirements.in", "examples/.python-version"]
prose = ["chapters/*.md"]
code = ["examples/*.py", "examples/*.out", "examples/data/*", "recordings/*", "prep/*"]
# The spoken descriptions and lexicon narration reads, beside the chapters. They're never on the page, so a change to
# them alone has no kind of change: it needs no kind label, cuts no edition of its own, and rides with the next one.
narration = ["narration/*.toml"]
skill = ["skill.md"]
meta = ["book.toml", "redirects.yml", "CODEOWNERS", "renovate.json", "README.md", "CITATION.cff", "LICENSE",
        "LICENSE-CODE", ".gitignore", ".github/workflows/*"]

[tiers.auto]
label = "tier:auto"
qualifies = "Typo or formatting: no change to meaning, code or versions"
approver = "agent"             # once checks pass, unless flagged

[tiers.quick]
label = "tier:quick"
qualifies = "Version bump: all checks green, no prose changed"
approver = "agent"             # once checks pass, unless flagged

[tiers.expert]
label = "tier:expert"
qualifies = "Changes meaning: anything that changes what the book says or what an example does"
approver = "agent"             # once checks pass, unless flagged; the community corrects anything wrong afterwards

# Serious risks: security, inappropriate content, copyright or legal problems, and scope or brand. A pull
# request that matches any rule below gets the label and waits for a Rolling Edition maintainer, whose approval is
# recorded privately; the bot then sets the review/maintainer status. Everything else merges once its checks pass.
#
# - The rules stand in for the agents' risk assessment. An assessment will only ever add the flag, never remove it,
#   and a maintainer can add it by hand.
# - Triage adds the label and never removes it.
# - The rules compare a pull request with the book on main, so they start after the first edition: a first edition
#   is the book as agents drafted and critiqued it, and needs no person's approval.
# - They're narrow on purpose, so routine work never waits: typo fixes, version bumps of pinned packages, rewritten
#   prose and changed examples all merge without a person.
# - Each rule says what it flags twice: `what` for contributors, in the repository's terms, and `reader` for the
#   site's "How we make books", in a reader's.
[flags]
label = "flag:serious"

[flags.workflows]
what = "Changes the repository's automation: a file under .github/, such as a workflow"
reader = "Changes the automation that checks and publishes the book"
paths = [".github/*"]

[flags.new-package]
what = "Adds a package the book didn't pin before, or a requirement that isn't a plain name==version pin, such as an index URL, a direct link or an editable install. A version bump of a pinned package isn't flagged"
reader = "Adds a new package to the examples, or installs one from anywhere but the package index. A new version of a package the book already uses isn't flagged"
files = ["examples/requirements.txt", "recordings/requirements.txt"]

[flags.unknown-files]
what = "Adds, changes or removes a file that isn't one of the kinds a book holds: chapters, examples and their data, pins, recordings, narration and the book's own settings"
reader = "Adds, changes or removes a file that isn't part of a book: its chapters, its examples and their data, the library versions they use, its recorded model outputs, its narration and its settings"

[flags.agent-skill]
what = "Changes skill.md, the procedures a reader's coding agent follows, in a pull request from anyone but the book's agents"
reader = "Changes the instructions that readers' coding agents follow, unless the book's own agents made the change"
files = ["skill.md"]
authors = "contributors"       # anyone but the bot: the book's agents keep it current as the book changes

[flags.book-identity]
what = "Changes the book's slug, title, authors, sponsor or status in book.toml: what it's called, who it credits, who funds it and whether it's listed"
reader = "Changes the book's name, web address, credits, sponsor or whether it's listed"
fields = ["slug", "title", "authors", "sponsor", "status"]

# Authored books: a book whose book.toml names its authors ([[authors]]) sets how much waits for them ([authorship]
# gate). On such a book, the changes its level lists wait for one of its authors to approve them on GitHub, as well as
# for their checks, and the bot sets the review/author status. The gate is read from book.toml on the book's main
# branch, never from the pull request, so a pull request can't lower its own gate. A house book names no authors and
# has no gate.
#
# - Who approves: the owner of a chapter the change touches, or the lead author; for anything outside an owned chapter,
#   any of the book's authors. A change to `lead_fields` in book.toml, or to `lead_files`, is always the lead author's.
# - An approval is the author's latest review of the pull request's current commit approving it, or a pull request
#   the author opened from their own fork. Dismissing it, or a later request for changes, cancels it, and an author's
#   request for changes holds the pull request until they review it again or it's dismissed.
# - A pull request flagged as a serious risk waits for a Rolling Edition maintainer and for the author.
# - Always automatic, at every level: a version bump that isn't a new major version, a security update from the app's
#   own branch, and a change to the generated front page and workflows alone from the app's own branch.
# - While a book is returned, Rolling Edition maintains it and nothing waits for its authors but a change to its
#   authors or its gate. The app's own pull request that returns a book after its author has gone doesn't wait for
#   them.
# - Each level says what it holds twice, as [flags] do: `what` for contributors, `reader` for the site.
[authors]
label = "waiting-for-author"          # on a pull request that waits for its author; the held list shows these apart
default = "meaning"                   # the level when [authorship] gives none
states = ["adopting", "active", "returned"]
roles = ["lead", "author"]
lead_fields = ["authors", "authorship"]   # book.toml's: a change to them is the lead author's
lead_files = ["voice.toml"]               # and so is a change to these
major_wait_hours = 72                 # at the "all" level, how long a new major version that passes waits for an author

[authors.levels.meaning]
what = "Waits for an author: a change of meaning (tier:expert), a grouped update that changes a recorded output included"
reader = "A change to what the book says or what an example does also waits for one of its authors to approve it"
tiers = ["expert"]

[authors.levels.standard]
what = "Waits for an author: a change of meaning (tier:expert) or a typo fix (tier:auto)"
reader = "Every change to the book's text or examples, typo fixes included, also waits for one of its authors to approve it"
tiers = ["expert", "auto"]

[authors.levels.all]
what = "Waits for an author: a change of meaning or a typo fix, a change to narration or skill.md alone, and a new major version that passes, which merges once it has waited {hours} hours unless an author asks for changes"
reader = "Every change also waits for one of its authors, narration and the instructions for coding agents included; a new major version of a library waits {hours} hours for them, then merges"
tiers = ["expert", "auto"]
rides_along = true                    # a change to narration or skill.md alone waits too
major = true                          # and a new major version that passes waits major_wait_hours, then merges
