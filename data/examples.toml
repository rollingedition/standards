# How the examples check reads a book's pins before it builds the runtime the examples run in.
#
# A resolver reads the package index's metadata for every pin and says whether they can be installed together. When
# they can't, the check reports the conflict the resolver names, in plain words, instead of a failed build: an update
# that one pin needs and another pin forbids is a different problem from an example that prints something new.
[resolver]
# The runtime's platform: the image is python:{version}-slim on x86-64, whose C library is glibc 2.36 or later, so a
# wheel built for manylinux_2_36 or older installs there.
python_platform = "x86_64-manylinux_2_36"
# The title of the check's annotation on GitHub when the pins can't be installed together. The platform's pull-request
# job reads it to tell this outcome from a failing example.
annotation = "The pins can't be installed together"
timeout_seconds = 180

# Open model files a book pins in examples/models.toml (models.py): fetched once when a runtime is built, each file's
# SHA-256 checked, then loaded offline from a Hugging Face cache at the pinned commit. `re-check models --pin` writes them.
[models]
base_url = "https://huggingface.co"
# The Lab's images carry the weights, so they ship like everything else in a book: only licences as open as
# CC BY 4.0, never custom terms, non-commercial or share-alike.
licences = ["apache-2.0", "mit", "bsd-2-clause", "bsd-3-clause", "cc0-1.0", "cc-by-4.0"]
max_total_mb = 4096
# The files `--pin` takes when none are named: the top-level files a transformers model loads.
default_files = ["*.json", "*.safetensors", "*.txt", "*.model", "*.jinja", "*.tiktoken"]
# ... less what training leaves behind, which no model loads
skip_files = ["*_results.json", "trainer_state.json", "training_args.json"]
# Where a container image keeps them, readable by any user. A venv keeps them in its runtime's folder, under hf/.
image_cache = "/opt/re/hf"

# Package indexes a book's examples/requirements.txt may add, as a line `--extra-index-url URL`, beside PyPI. PyTorch's
# CPU builds (torch==X+cpu) live only on its own index, and the PyPI build brings gigabytes of GPU libraries that no
# runtime here can use. The pins stay exact; uv then reads every index for the best match, as pip does.
[runtime]
extra_indexes = ["https://download.pytorch.org/whl/cpu"]

# How every runner starts an example: the harness's backends here, and the platform's, which take these values from here
# (the Lab's worker, its release check and its assignments, the members' runtime). Each example runs as
# `python -B -P -s .re_harness.py EXAMPLE.py` in a clean environment: no bytecode written, no script folder or user site
# on the path, and the environment honoured, so PYTHONHASHSEED and the thread counts below take effect. `-I` would
# ignore every PYTHON* variable, which left string hashing, and so set order, random on every run until Nov 12, 2026.
[run]
# Every numeric library's threads, whatever the machine has: OpenMP (and so PyTorch's own and LightGBM's), OpenBLAS,
# MKL, Polars and Rayon. A sum split across threads rounds differently with each count: np.dot printed different last
# digits at 1, 2, 4 and 16 threads. 4: Release, the release service, the drafting sessions and GitHub's runners each
# have 4 vCPUs, so the outputs books recorded there hold. On fewer CPUs an example runs slower, never differently.
threads = 4
# The hash seed an example runs under (PYTHONHASHSEED). `re-check examples --seeds 0,1` runs each one under each seed
# given and fails when any output differs, since a reader's own Python picks a random seed every run.
seed = 0
# BLAS kernels, pinned only when not empty: OPENBLAS_CORETYPE names OpenBLAS's kernel instead of the one it picks for the
# CPU, and MKL_CBWR MKL's code path. A kernel changes a sum's last digits as threads do, so a CPU with AVX-512, such as
# Release's, could print what one without doesn't. A pin must name a kernel every runner's CPU has: forcing one it lacks
# crashes the example. Haswell's needs AVX2 and FMA, which every runner has (Release's and the Labs' c3d, the e2
# machines, GitHub's runners), and it's the kernel the books' outputs pass on where AVX-512 is missing. MKL (PyTorch's)
# isn't pinned: what MKL_CBWR does on AMD's CPUs couldn't be measured, and the books pass on Release's c3d as they are.
openblas_coretype = "Haswell"
mkl_cbwr = ""
