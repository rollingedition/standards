# Limits and word lists for `re-check style`, the lint half of the writing standards
# (standards/writing/README.md). Rule IDs in comments. Defaults; change them here, never in code.

[length]                       # W-7, W-18
chapter_words = [3000, 6000]
section_words = [200, 900]     # a ## section, including its ### subsections
book_chapters = [5, 12]        # checked once a book's status is live
example_lines = 40             # non-blank lines; the standard says "about 30"
table_columns = 6              # W-53: the most columns a table may have

[words]
# W-24: phrases that date the text. "now" and "new" are left to the critic: they are fine for steps in a procedure.
time = ["recently", "currently", "as of this writing", "at the time of writing", "the latest", "nowadays",
        "these days", "modern", "soon", "new in", "newly", "state of the art", "state-of-the-art", "cutting edge"]
# W-35: minimizers and hype. Superlatives used as measured facts ("the best-scoring model") are left to the critic.
banned = ["simply", "just", "easy", "easily", "obviously", "clearly", "of course", "powerful", "seamless",
          "seamlessly", "cutting-edge", "revolutionary", "leverage", "leverages", "leveraging", "leveraged",
          "utilize", "utilizes", "utilizing", "dive into", "dives into", "delve", "delves", "ultimate",
          "world-class", "best-in-class", "game-changing", "game changer"]
# W-25: other names a pinned package goes by in prose
aliases = { scikit-learn = ["sklearn"], python = ["Python"] }

[headings]                     # W-36: words that keep their capitals in a sentence-case heading
proper_nouns = ["Python", "BM25", "Wayfair", "WANDS", "Rolling", "Edition", "English", "Google", "Bing",
                "Amazon", "Elasticsearch", "OpenSearch", "Solr", "Lucene", "Okapi", "TREC", "MS", "MARCO",
                "LambdaMART", "RankNet", "LightGBM", "XGBoost", "SPLADE", "ColBERT", "HyDE", "RAG", "LLM", "LLMs",
                "A/B", "I", "Bayes", "Markov", "Gaussian", "Fourier", "Jaccard", "Kendall", "Spearman", "Pearson"]
# W-4: phrases a chapter's title never uses, checked while a book is drafted (released books keep their titles)
chapter_title_avoid = ["end to end", "end-to-end"]

[working_rule]                 # W-10: a section closes with a paragraph that opens with this label in bold
label = "Working rule"
retired = ["What to do"]       # earlier labels: re-check style asks for the new one, and the sites still style them

[narrative]                    # W-61 to W-68, section 14: the habits a review of the released books measured (Nov 13, 2026)
paragraph_bindings = 4         # W-61: more bound numbers than this in one paragraph is a warning: lead with the point
yes_no = ["True", "False"]     # W-61: values a binding never puts in the prose; assert them, or print a word
quotes_per_paragraph = 1       # W-62: more quotations than this in one paragraph is a warning
quote_words = 4                #       a quotation counts from this many words, so a quoted term doesn't
links_per_sentence = 2         # W-62: more links than this in one sentence is a warning
stock_uses = 2                 # W-63: the most times a chapter may use each stock opener or phrase below
# W-63: openers that mark a step instead of making a sentence, as regular expressions matched where a sentence starts
stock_openers = ['(?:For|In|On) the [a-z]+,', 'The examples? ', 'Asked whether ']
# W-63: phrases that point a working rule back at its own section, matched anywhere, in any case
stock_phrases = ['\bas here\b', '\bas (?:this|the) example does\b']
repeated_sentence_words = 12   # W-63: a sentence of this many words or more appears once in a book
repeated_opening_words = 10    # W-64: a sentence's first words, the same in this many chapters or more, are a template
repeated_opening_chapters = 3
repeated_openings_allowed = ["By the end of this chapter"]   # W-2's promise: every chapter opens with it, by design

[recordings]                   # W-48: every recorded output folder carries a manifest with these keys
manifest = ["script", "model", "model_version", "prompt_sha256", "created", "outputs"]

[skill]                        # W-57 to W-59: skill.md, beside book.toml, the hand-written part of the book's agent skill
required_for = ["draft"]       # book statuses that fail without one; a live book without one gets a note
description_max = 1024         # the Agent Skills format's limit for `description`
max_lines = 400                # non-blank lines of procedures; the generated stamp and setup take the rest of SKILL.md's 500
max_words = 3000               # about 4,000 tokens, inside the format's advice of 5,000 for a whole SKILL.md
min_procedures = 1
link_hosts = ["rollingedition.com", "rollingedition.ai"]   # besides the sources the chapters cite

[skill.os]                     # W-81: a skill's commands run on macOS, Linux and Windows, or give each its own form
# What the rules read: inline code ("inline"), each line of a shell block and each command of a session block, after
# its prompt ("shell"), each line of a Windows block ("windows") and, only for a rule whose `in` names it, any other
# block with a language ("code"). A session's other lines, an output block and a block with no language are output,
# which nothing reads. A block is known by its info string's first word; comment lines in a shell block aren't read.
shells = ["sh", "bash", "zsh", "shell"]
sessions = ["console", "shell-session", "terminal"]
prompt = '^\s*[$%]\s+'
windows = ["powershell", "pwsh", "ps1", "cmd", "bat", "batch"]
output = ["text", "txt", "output", "plaintext", "log"]
# Where a command starts, for a pattern's {cmd}: at the start, or after ; & | ( or then, do and else
cmd = '(?:^|[;&|(]\s*|\b(?:then|do|else)\s+)'

# Each rule has an `id`; a `pattern`, a Python regular expression, whose group `found`, if it has one, is what the
# message names; a `level`, fail, or warn: listed to read again, never failing; and `in`, what it reads (shell and
# inline unless it says). It holds unless the procedure it's in, everything under the same heading, gives the other
# systems' form: by any of its `unless` patterns, or, with `windows_form`, a Windows block. `message` says what to
# write instead, with {found} for what matched.
[[skill.os.rules]]
id = "machine-path"            # someone's home folder, on Linux, macOS or Windows
level = "fail"
in = ["shell", "inline", "windows"]
pattern = '(?<![\w.$%~:/\\-])/(?:home|Users)/[\w.-]+[^\s"\x27`)]*|(?<![\w\\/.-])[A-Za-z]:[\\/]Users[\\/][\w.-]+[^\s"\x27`)]*'
message = "`{found}` is a folder on one person's machine: write the path relative to the project, as `data/raw.csv`"

[[skill.os.rules]]
id = "sudo"
level = "fail"
in = ["shell", "inline", "windows"]
pattern = '{cmd}(?P<found>sudo\s+\S+)'
message = "`{found}`: sudo asks for a password an agent can't give, and changes the machine, not the project: install into the project's environment (`uv pip install …`), or say what the reader installs themselves"

[[skill.os.rules]]
id = "posix-environment"       # a virtual environment's bin/, which is Scripts\ on Windows
level = "warn"
pattern = '(?<![\w.-])(?:\S*/)?(?:bin/activate(?:\.\w+)?|[\w.-]*env/bin/(?:python|pip)[\d.]*)(?![\w-])'
unless = ['Scripts[\\/]', 'Activate\.ps1', 'activate\.bat']
windows_form = true
message = "`{found}`: an environment on Windows keeps these in Scripts\\, not bin/: give the Windows form too, as `.venv\\Scripts\\activate` or `.venv\\Scripts\\python.exe`"

[[skill.os.rules]]
id = "python3"
level = "warn"
pattern = '{cmd}(?P<found>python3(?:\.\d+)?)(?=\s|$)'
unless = ['\bWindows\b', '(?<![\w./-])py\s+(?:-3|\S+\.py)']
windows_form = true
message = "`{found}`: an environment on Windows has `python`, not `python3`: write `python`, run in the project's environment"

[[skill.os.rules]]
id = "tmp"
level = "warn"
in = ["shell", "inline", "code"]
pattern = '(?<![\w.~$/-])/tmp(?![\w.-])[^\s"\x27`)]*'
windows_form = true
message = "`{found}`: Windows has no /tmp: use a folder in the project that .gitignore leaves out, or Python's tempfile"

[[skill.os.rules]]
id = "tilde"                   # ~ handed to a command; a path written alone, as `~/.cache`, is left to the reader
level = "warn"
pattern = '(?<=[\s=])~[/\\][^\s"\x27`)]*'
windows_form = true
message = "`{found}`: cmd and Windows PowerShell hand ~ to a program as typed: write the path relative to the project, or $HOME, which bash, zsh and PowerShell expand"

[[skill.os.rules]]
id = "backslash-path"          # .\x, a\b\c, a\b.ext, C:\x; a regular expression's \. or \( is no folder
level = "warn"
pattern = '(?<![^\s"\x27=(])(?:\.{1,2}\\[\w.$%-]|[\w.$%-]+\\[\w$%][\w.$%-]*\\[\w$%]|[\w-]+\\[\w$%][\w-]*\.[A-Za-z]{1,4}\b|[A-Za-z]:\\[\w$%])[^\s"\x27`)]*'
unless = ['\bWindows\b', '\bPowerShell\b', '\bcmd\b']
message = "`{found}`: a backslash separates folders only on Windows: write /, which programs on Windows and PowerShell take too"

[[skill.os.rules]]
id = "export"
level = "warn"
pattern = '{cmd}(?P<found>export\s+[A-Za-z_]\w*=)'
unless = ['\$env:']
windows_form = true
message = "`{found}`: Windows shells have no export: give the PowerShell form too (`$env:NAME = \"value\"`), or set the value where the code reads it"

[[skill.os.rules]]
id = "one-command-variable"    # NAME=value command
level = "warn"
pattern = '{cmd}(?P<found>(?:[A-Z_][A-Z0-9_]*=\S*\s+)+)(?=[a-z./][\w./-]*(?:\s|$))'
unless = ['\$env:']
windows_form = true
message = "`{found}`: a Windows shell can't set a variable for one command: give the PowerShell form too (`$env:NAME = \"value\"`, then the command), or set it where the code reads it"

[[skill.os.rules]]
id = "dev-null"
level = "warn"
pattern = '/dev/null\b'
windows_form = true
message = "`/dev/null`: Windows has none (PowerShell writes $null, cmd NUL): leave the redirect out, or give the Windows form too"

[[skill.os.rules]]
id = "line-continuation"       # && and || chains are fine: PowerShell 7 and cmd run them
level = "warn"
in = ["shell"]
pattern = '(?<!\\)\\$'
windows_form = true
message = "a line continued with \\: a Windows shell doesn't (PowerShell continues with `, cmd with ^): write the command on one line"

# An install with a package manager only one system has fails, unless its procedure names an install for each of the
# others, by its manager or the system's name, or installs with one that every system has (`anywhere`).
[skill.os.installs]
level = "fail"
in = ["shell", "inline", "windows"]
verbs = '(?:--?[\w-]+(?:=\S+)?\s+)*(?:install|add|-S\w*)(?![\w-])'
anywhere = '(?<![\w.-])(?:uv\s+(?:pip\s+install|add|tool\s+install)|pipx?\s+install|python\s+-m\s+pip\s+install|conda\s+install|mamba\s+install|pixi\s+add)\b'
message = "`{found}` installs on {family} only, and the procedure names no install for {missing}: give theirs too, or install with what every system has, such as `uv pip install`"
families.macOS = { managers = ["brew"], names = ['\bmacOS\b', '\bMacs?\b', '\bOS X\b'] }
families.Linux = { managers = ["apt-get", "apt", "dnf", "yum", "zypper", "pacman", "apk", "snap"], names = ['\bLinux\b', '\bDebian\b', '\bUbuntu\b', '\bFedora\b', '\bRHEL\b', '\bAlpine\b'] }
families.Windows = { managers = ["winget", "choco", "scoop"], names = ['\bWindows\b'] }

[summary]                      # W-60: book.toml's summary, one sentence in the catalog's shape
words = [30, 55]               # the usual range, about 40 words: outside it, re-check manifest notes it and never fails

[kit]                          # what every new draft starts with (`re-check kit`), and what `re-check style` holds a draft to
threads = 2                    # each numerical library's threads, set by examples/lib before any of them loads
seed = 0                       # Python's random and numpy's global generator, seeded by examples/lib
thread_variables = ["OMP_NUM_THREADS", "OPENBLAS_NUM_THREADS", "MKL_NUM_THREADS", "NUMEXPR_NUM_THREADS",
                    "VECLIB_MAXIMUM_THREADS", "RAYON_NUM_THREADS", "POLARS_MAX_THREADS"]
# .gitignore's lines: bytecode, environments and scratch never reach the book. A book adds its own below them.
ignore = ["__pycache__/", "*.py[cod]", ".venv/", "/scratch/", ".ipynb_checkpoints/", ".pytest_cache/", "*.egg-info/",
          ".DS_Store"]
# W-17, by the code: an example imports from lib before any of these, so their threads and seeds are fixed first
numerical = ["numpy", "scipy", "pandas", "polars", "pyarrow", "sklearn", "statsmodels", "torch", "tensorflow", "jax",
             "lightgbm", "xgboost", "catboost", "numba", "transformers", "sentence_transformers", "tokenizers", "faiss",
             "onnxruntime", "peft", "statsforecast", "mlforecast", "neuralforecast", "prophet", "gensim", "implicit"]
# What reads the clock or the memory in use: an entry that's a module covers everything in it
timing = ["time.time", "time.time_ns", "time.perf_counter", "time.perf_counter_ns", "time.monotonic", "time.monotonic_ns",
          "time.process_time", "time.process_time_ns", "time.thread_time", "time.thread_time_ns", "time.localtime",
          "time.gmtime", "time.ctime", "time.strftime", "timeit", "tracemalloc", "resource.getrusage", "psutil",
          "datetime.datetime.now", "datetime.datetime.today", "datetime.datetime.utcnow", "datetime.date.today",
          "pandas.Timestamp.now", "pandas.Timestamp.today", "pandas.Timestamp.utcnow"]
# What lists results in whatever order the file system or the workers give: by name, and as a method on any object
unordered = ["os.listdir", "os.scandir", "os.walk", "glob.glob", "glob.iglob", "concurrent.futures.as_completed"]
unordered_methods = ["iterdir", "glob", "rglob", "imap_unordered"]

# An authored book's voice (voice.toml, beside book.toml): what its [overrides] may change, and within what bounds.
# Lengths, who speaks and the narrative limits that set the tone are adjustable; everything else stays as these
# standards say for every book: examples that run (W-17 to W-23, W-48), versions and numbers (W-24 to W-27), claims and
# their evidence (W-28, W-30 to W-32, W-69), citations (W-29, W-62) and accessibility (W-39, W-53 to W-56). Each bound is
# the widest an override may go; the standards' own limit is inside it.
[adjustable]
fixed = ["W-17", "W-19", "W-20", "W-21", "W-22", "W-23", "W-24", "W-25", "W-26", "W-27", "W-28", "W-29", "W-30",
         "W-31", "W-32", "W-39", "W-48", "W-53", "W-54", "W-55", "W-56", "W-62", "W-69"]

[adjustable.length]            # W-7 and W-18's numbers, as [length] has them
chapter_words = [1500, 9000]
section_words = [150, 1500]
example_lines = [20, 60]

[adjustable.narrative]         # W-61 and W-63's numbers, as [narrative] has them: the tone's limits
paragraph_bindings = [2, 8]
stock_uses = [1, 4]

[adjustable.person]            # W-34: who speaks. "we" is the standards'; an author writing alone may say "I"
allowed = ["we", "I"]
