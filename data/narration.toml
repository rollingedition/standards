# The shared rules of narration (re_standards/spoken.py): how a book's text becomes the words a voice reads.
# A book adds its own terms in narration/lexicon.toml, and its descriptions in narration/{chapter_id}.toml.
# Every word read aloud is the edition's text or one of the templates below; nothing is written by a model.

# Raise this whenever a change here can change how a voice reads the same words, such as a pause or a template:
# a recorded paragraph is kept only while its words, its voice and this number stay the same.
rules_version = 2

[templates]
# A chapter opens with its number, its title and the book's title, then the disclosure, and ends with its number. It
# never names the edition, so a chapter whose words didn't change keeps its recording across editions; the whole
# book's credits name it. Numbers and codes are written as digits: the rules below read them as words.
opening = "Chapter {number}. {title}. {book_title}."
disclosure = "Read by an AI voice, word for word from this edition's text. Code, output and tables are on the page."
ending = "End of chapter {number}."
heading = "{text}."                      # a section heading, read as a sentence
example = "Example: {name}. {description}"
ordered_item = "{number}. {text}"        # an item of a numbered list; a bulleted one is read as it is
quote = "{text}"
link_url = "a link on the page"          # a link whose text is its address

[templates.fallback]                     # what's read where the book gives no description
example = "Example: {name}. Its code and output are on the page."
table = "A table is on the page."

[templates.fallback.block]               # a fenced block that isn't an example, by its language
text = "A formula is on the page."
default = "Code is on the page."

[templates.book]
# The whole-book file opens and closes with credits. Each entry is one sentence, or a list of choices: the first
# whose fields are all given is read, and an entry with none is left out. The caller gives the voice's credit
# (voice) and where the current edition is (where); the title and edition come from the book.
opening = [
    "{title}.",
    "By Rolling Edition, with AI.",
    ["Read by an AI voice, {voice}.", "Read by an AI voice."],
    "Edition {edition}.",
    "Its text is under the Creative Commons Attribution 4.0 licence, and its code under the MIT licence.",
]
closing = [
    ["This is the end of {title}, edition {edition}.", "This is the end of {title}."],
    "The current edition is at {where}.",
]

[numbers]
and = true                 # "one hundred and seventy-seven", as British English reads it
years = [1900, 2099]       # a typed four-digit number in this range is a year: "twenty twenty-two", "two thousand four".
                           # A number a binding fills in is a count, never a year: "nineteen thirty-seven" would be wrong
point = "point"            # decimals digit by digit: "zero point six one five"
minus = "minus"            # a minus sign before a number
percent = "percent"
by = "by"                  # "3×3"
range = "to"               # "6–10"
version = "version"        # "v2"
plus = "plus"              # a plus sign before a number
over = "over"              # "8/3", "1/(60 + rank)"
about = "about"            # "~1"
times = "times"            # "14x"
currency = { "$" = "dollars", "€" = "euros", "£" = "pounds" }   # "$3" is "three dollars"
times_ten = "times ten to the"   # "3.00e-03"
utc = "U T C"
squared = "squared"        # a superscript 2
cubed = "cubed"
power = "to the"           # any other superscript: "10⁻⁵" is "ten to the minus five"
suffixes = { K = "thousand", M = "million", B = "billion" }   # "360M", "1.7B"
months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October",
          "November", "December"]

