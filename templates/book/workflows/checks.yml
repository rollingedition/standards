# The shared book checks from the standards repository. A pull request runs the examples its change could affect,
# against its base, and every week every example runs again on main, whatever changed, as it can also be run by hand.
# The weekly run's time is drawn from the book's name, so the books' runs don't all start at once.
name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "{weekly_cron}"
  workflow_dispatch:
  # {terminal}
    inputs:
      record:
        description: Record every step's output instead, each chapter twice from a fresh start, as the run's artifact
        type: boolean
        default: false
  # {/terminal}

permissions:
  contents: read

jobs:
  checks:
    uses: {org}/standards/.github/workflows/book-checks.yml@v1
    with:
      examples-scope: ${{ github.event_name == 'pull_request' && 'affected' || 'all' }}
  # {terminal}
  # A terminal book's steps and checks: its stack's pins, its local lab, and each chapter its change could affect, from a
  # fresh start. Only a book whose book.toml says [lab] kind = "terminal" carries this job.
  commands:
    uses: {org}/standards/.github/workflows/book-commands.yml@v1
    with:
      scope: ${{ github.event_name == 'pull_request' && 'affected' || 'all' }}
      record: ${{ github.event_name == 'workflow_dispatch' && inputs.record == true }}
  # {/terminal}
