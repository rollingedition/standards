# Limits and word lists for `re-check style`, the lint half of the writing standards
# (standards/writing/README.md). Rule IDs in comments. Defaults; change them here, never in code.

[length]                       # W-7, W-18
chapter_words = [3000, 6000]
section_words = [200, 900]     # a ## section, including its ### subsections
book_chapters = [5, 12]        # checked once a book's status is live
example_lines = 40             # non-blank lines; the standard says "about 30"
table_columns = 6              # W-53: the most columns a table may have

[words]
# W-24: phrases that date the text. "now" and "new" are left to the critic: they are fine for steps in a procedure.
time = ["recently", "currently", "as of this writing", "at the time of writing", "the latest", "nowadays",
        "these days", "modern", "soon", "new in", "newly", "state of the art", "state-of-the-art", "cutting edge"]
# W-35: minimizers and hype. Superlatives used as measured facts ("the best-scoring model") are left to the critic.
banned = ["simply", "just", "easy", "easily", "obviously", "clearly", "of course", "powerful", "seamless",
          "seamlessly", "cutting-edge", "revolutionary", "leverage", "leverages", "leveraging", "leveraged",
          "utilize", "utilizes", "utilizing", "dive into", "dives into", "delve", "delves", "ultimate",
          "world-class", "best-in-class", "game-changing", "game changer"]
# W-25: other names a pinned package goes by in prose
aliases = { scikit-learn = ["sklearn"], python = ["Python"] }

[headings]                     # W-36: words that keep their capitals in a sentence-case heading
proper_nouns = ["Python", "BM25", "Wayfair", "WANDS", "Rolling", "Edition", "English", "Google", "Bing",
                "Amazon", "Elasticsearch", "OpenSearch", "Solr", "Lucene", "Okapi", "TREC", "MS", "MARCO",
                "LambdaMART", "RankNet", "LightGBM", "XGBoost", "SPLADE", "ColBERT", "HyDE", "RAG", "LLM", "LLMs",
                "A/B", "I", "Bayes", "Markov", "Gaussian", "Fourier", "Jaccard", "Kendall", "Spearman", "Pearson"]
# W-4: phrases a chapter's title never uses, checked while a book is drafted (released books keep their titles)
chapter_title_avoid = ["end to end", "end-to-end"]

[working_rule]                 # W-10: a section closes with a paragraph that opens with this label in bold
label = "Working rule"
retired = ["What to do"]       # earlier labels: re-check style asks for the new one, and the sites still style them

[narrative]                    # W-61 to W-68, section 14: the habits a review of the released books measured (Nov 13, 2026)
paragraph_bindings = 4         # W-61: more bound numbers than this in one paragraph is a warning: lead with the point
yes_no = ["True", "False"]     # W-61: values a binding never puts in the prose; assert them, or print a word
quotes_per_paragraph = 1       # W-62: more quotations than this in one paragraph is a warning
quote_words = 4                #       a quotation counts from this many words, so a quoted term doesn't
links_per_sentence = 2         # W-62: more links than this in one sentence is a warning
stock_uses = 2                 # W-63: the most times a chapter may use each stock opener or phrase below
# W-63: openers that mark a step instead of making a sentence, as regular expressions matched where a sentence starts
stock_openers = ['(?:For|In|On) the [a-z]+,', 'The examples? ', 'Asked whether ']
# W-63: phrases that point a working rule back at its own section, matched anywhere, in any case
stock_phrases = ['\bas here\b', '\bas (?:this|the) example does\b']
repeated_sentence_words = 12   # W-63: a sentence of this many words or more appears once in a book
repeated_opening_words = 10    # W-64: a sentence's first words, the same in this many chapters or more, are a template
repeated_opening_chapters = 3
repeated_openings_allowed = ["By the end of this chapter"]   # W-2's promise: every chapter opens with it, by design

[recordings]                   # W-48: every recorded output folder carries a manifest with these keys
manifest = ["script", "model", "model_version", "prompt_sha256", "created", "outputs"]

[skill]                        # W-57 to W-59: skill.md, beside book.toml, the hand-written part of the book's agent skill
required_for = ["draft"]       # book statuses that fail without one; a live book without one gets a note
description_max = 1024         # the Agent Skills format's limit for `description`
max_lines = 400                # non-blank lines of procedures; the generated stamp and setup take the rest of SKILL.md's 500
max_words = 3000               # about 4,000 tokens, inside the format's advice of 5,000 for a whole SKILL.md
min_procedures = 1
link_hosts = ["rollingedition.com", "rollingedition.ai"]   # besides the sources the chapters cite

[summary]                      # W-60: book.toml's summary, one sentence in the catalog's shape
words = [30, 55]               # the usual range, about 40 words: outside it, re-check manifest notes it and never fails

[kit]                          # what every new draft starts with (`re-check kit`), and what `re-check style` holds a draft to
threads = 2                    # each numerical library's threads, set by examples/lib before any of them loads
seed = 0                       # Python's random and numpy's global generator, seeded by examples/lib
thread_variables = ["OMP_NUM_THREADS", "OPENBLAS_NUM_THREADS", "MKL_NUM_THREADS", "NUMEXPR_NUM_THREADS",
                    "VECLIB_MAXIMUM_THREADS", "RAYON_NUM_THREADS", "POLARS_MAX_THREADS"]
# .gitignore's lines: bytecode, environments and scratch never reach the book. A book adds its own below them.
ignore = ["__pycache__/", "*.py[cod]", ".venv/", "/scratch/", ".ipynb_checkpoints/", ".pytest_cache/", "*.egg-info/",
          ".DS_Store"]
# W-17, by the code: an example imports from lib before any of these, so their threads and seeds are fixed first
numerical = ["numpy", "scipy", "pandas", "polars", "pyarrow", "sklearn", "statsmodels", "torch", "tensorflow", "jax",
             "lightgbm", "xgboost", "catboost", "numba", "transformers", "sentence_transformers", "tokenizers", "faiss",
             "onnxruntime", "peft", "statsforecast", "mlforecast", "neuralforecast", "prophet", "gensim", "implicit"]
# What reads the clock or the memory in use: an entry that's a module covers everything in it
timing = ["time.time", "time.time_ns", "time.perf_counter", "time.perf_counter_ns", "time.monotonic", "time.monotonic_ns",
          "time.process_time", "time.process_time_ns", "time.thread_time", "time.thread_time_ns", "time.localtime",
          "time.gmtime", "time.ctime", "time.strftime", "timeit", "tracemalloc", "resource.getrusage", "psutil",
          "datetime.datetime.now", "datetime.datetime.today", "datetime.datetime.utcnow", "datetime.date.today",
          "pandas.Timestamp.now", "pandas.Timestamp.today", "pandas.Timestamp.utcnow"]
# What lists results in whatever order the file system or the workers give: by name, and as a method on any object
unordered = ["os.listdir", "os.scandir", "os.walk", "glob.glob", "glob.iglob", "concurrent.futures.as_completed"]
unordered_methods = ["iterdir", "glob", "rglob", "imap_unordered"]
